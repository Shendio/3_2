<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stacje NOAA</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Stacje meteorologiczne NOAA</h1>

      <button type="button" id="loadBtn">Pobierz stacje</button>

      <p id="status" aria-live="polite"></p>

      <table id="stationsTable" hidden>
        <thead>
          <tr>
            <th>Station ID</th>
            <th>Name</th>
            <th>Latitude</th>
            <th>Longitude</th>
          </tr>
        </thead>
        <tbody id="stationsBody"></tbody>
      </table>
    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
